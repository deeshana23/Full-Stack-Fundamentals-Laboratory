<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h6">My To-Do List</span>
    </div>
  </nav>
  <div class="container my-4">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
      <div class="card-body p-4">
        <h5 class="text-center fw-bold">Task Manager</h5>
        <p class="text-center text-muted small">Organize your tasks and stay productive.</p>
        <div class="input-group mt-3">
          <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
          <button class="btn btn-primary" id="addBtn">Add Task</button>
        </div>
        <div id="errorMsg" class="text-danger small mt-1 d-none">Task cannot be empty!</div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <small class="text-muted" id="counter">Your tasks</small>
          <span class="badge bg-primary" id="remainingBadge">0 remaining</span>
        </div>
        <div class="btn-group w-100 mt-2">
          <button class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
          <button class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
          <button class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
        </div>
        <ul id="taskList" class="list-group mt-3"></ul>
        <p id="emptyMsg" class="text-center text-muted small mt-3">No tasks yet. Add your first task!</p>
        <div class="text-end mt-3">
          <button class="btn btn-outline-danger btn-sm" id="clearCompletedBtn">Clear Completed</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
